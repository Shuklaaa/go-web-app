# we can write any name for the workflow, here we are naming it as CI

name: CI #this is the name of the workflow, you can give any name to it

on:
  push:
    branches:
      - main #this workflow will run when there is a push to the main branch
    paths-ignore:
      - 'README.md' #this workflow will not run when there is a change in the README.md file
      - 'helm/**' #this workflow will not run when there is a change in the helm directory

jobs:  #this is the section where we define the jobs that will run in this workflow

  build: #this is the name of the job, you can give any name to it
    runs-on: ubuntu-latest #this job will run on the latest version of ubuntu

    steps: #this is the section where we define the steps that will run in this job
    - name: Checkout repository #this is the name of the step, you can give any name to it
      uses: actions/checkout@v4 #this step will checkout the code from the repository

    - name: Set up Go 1.22
      uses: actions/setup-go@v2
      with:
        go-version: 1.22

    - name: Build
      run: go build -o go-web-app

    - name: Test
      run: go test ./...

  code-quality:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest

  push:
    runs-on: ubuntu-latest

    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push action
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:${{github.run_id}}

  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest

    needs: push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }}

    - name: Update tag in Helm chart
      run: |
        sed -i 's/tag: .*/tag: "${{github.run_id}}"/' helm/go-web-app-chart/values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.email "shuklaabhishek0404@gmail.com"
        git config --global user.name "Abhishek Shukla"
        git add helm/go-web-app-chart/values.yaml
        git commit -m "Update tag in Helm chart"
        git push
